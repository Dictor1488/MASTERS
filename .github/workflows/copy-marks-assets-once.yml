name: Copy MARKS assets once

on:
  push:
    paths:
      - '.github/workflows/copy-marks-assets-once.yml'

permissions:
  contents: write

jobs:
  copy-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact MARKS icons
        run: |
          python - <<'PY'
          import os
          import urllib.request

          files = [
              'AT-SPG.png', 'SPG.png', 'heavyTank.png', 'lightTank.png', 'mediumTank.png',
              'china.png', 'czech.png', 'france.png', 'germany.png', 'italy.png', 'japan.png',
              'poland.png', 'sweden.png', 'uk.png', 'usa.png', 'ussr.png'
          ]
          src = 'https://raw.githubusercontent.com/Dictor1488/MARKS/main/resources/in/gui/gameface/mods/inq/marks/icons/'
          dst = 'resources/in/gui/gameface/mods/under_pressure/mastery/icons'
          os.makedirs(dst, exist_ok=True)
          for name in files:
              urllib.request.urlretrieve(src + name, os.path.join(dst, name))
              print('copied', name)
          PY
      - name: Commit copied assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/in/gui/gameface/mods/under_pressure/mastery/icons
          if git diff --cached --quiet; then
            echo 'No asset changes'
            exit 0
          fi
          git commit -m 'Copy MARKS statistics icon assets'
          git push origin HEAD:main
