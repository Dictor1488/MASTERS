name: Remove dead config code

on:
  push:
    paths:
      - '.github/workflows/remove-dead-config.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove unused config constants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('python/gui/mods/mod_under_pressure_mastery.py')
          text = source_path.read_text(encoding='utf-8')

          obsolete_paths = (
              "_CONFIG_DIR = os.path.normpath(os.path.join(os.getcwd(), 'mods', 'configs', 'mastery'))\n",
              "_CONFIG_FILE = os.path.join(_CONFIG_DIR, 'mastery.json')\n",
          )
          for line in obsolete_paths:
              if line not in text:
                  raise SystemExit('Expected obsolete config path is missing: ' + line.strip())
              text = text.replace(line, '', 1)

          start = text.find('_CONFIG_DEFAULTS = {')
          end = text.find('\n\n\ndef _cancelCallbackSafe', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the obsolete config constants block')

          text = text[:start] + text[end:]

          for token in (
              '_CONFIG_DIR',
              '_CONFIG_FILE',
              '_CONFIG_DEFAULTS',
              '_CONFIG_MODES',
              '_CONFIG_BADGE_STYLES',
          ):
              if token in text:
                  raise SystemExit('Obsolete token still remains: ' + token)

          source_path.write_text(text, encoding='utf-8')
          Path('.github/workflows/remove-dead-config.yml').unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- python/gui/mods/mod_under_pressure_mastery.py .github/workflows/remove-dead-config.yml
          git diff --cached --check
          git commit -m "Remove dead config code"
          git push origin HEAD:main
