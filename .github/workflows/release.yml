name: Build and Release Masters

on:
  workflow_dispatch:
    inputs:
      version:
        description: Mod version (for example 0.1.0)
        required: true
        default: 0.2.1
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MOD_ID: "mastery_under_inq"
  MOD_NAME: "Masters"
  MOD_DESCRIPTION: "Hangar mastery and marks thresholds panel (GameFace)"
  PJORION_DOWNLOAD_URL: "https://koreanrandom.com/forum/applications/core/interface/file/attachment.php?id=142445"
  PJORION_EXE_SHA256: "aecca1ade73418b37e27669d8b4caba386bbc860ea7ed73d7f1aa6e7920738aa"

jobs:
  build-and-release:
    name: Build Masters
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $version = "${{ inputs.version }}".Trim()
          } else {
              $version = "${{ github.ref_name }}".TrimStart("v")
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Release version is empty"
          }

          if ($version -notmatch '^[0-9]+(\.[0-9]+){1,3}([-.][0-9A-Za-z.-]+)?$') {
              throw "Invalid version: $version"
          }

          "PROJECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir psutil
          npm install --global javascript-obfuscator@4.1.1
          javascript-obfuscator --version

      - name: Install x86 Python 2.7 for PjOrion
        shell: pwsh
        run: |
          $python27 = "C:\Python27\python.exe"
          if (-not (Test-Path $python27)) {
              $installer = Join-Path $env:RUNNER_TEMP "python-2.7.18.msi"
              $url = "https://www.python.org/ftp/python/2.7.18/python-2.7.18.msi"
              Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing -TimeoutSec 300
              $process = Start-Process msiexec.exe -ArgumentList @(
                  "/i", $installer,
                  "/qn",
                  "/norestart",
                  "TARGETDIR=C:\Python27"
              ) -Wait -PassThru
              if ($process.ExitCode -notin @(0, 3010)) {
                  throw "Python 2.7 installer failed with exit code $($process.ExitCode)"
              }
          }
          if (-not (Test-Path $python27)) {
              throw "Python 2.7 was not installed at $python27"
          }
          if (-not (Test-Path "C:\Python27\python27.dll")) {
              throw "x86 python27.dll was not found"
          }
          & $python27 --version

      - name: Download and verify PjOrion 1.3.5
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "PjOrion_1.3.5_11.08.2019.zip"
          $runtime = Join-Path $env:RUNNER_TEMP "pjorion-runtime"

          curl.exe --fail --location --retry 3 --retry-delay 3 `
              --user-agent "Mozilla/5.0" `
              --output $archive `
              "${{ env.PJORION_DOWNLOAD_URL }}"
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to download PjOrion"
          }

          Expand-Archive -Path $archive -DestinationPath $runtime -Force
          $exe = Get-ChildItem -Path $runtime -Filter PjOrion.exe -Recurse | Select-Object -First 1
          if ($null -eq $exe) {
              throw "PjOrion.exe was not found in downloaded archive"
          }

          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLowerInvariant()
          if ($hash -ne "${{ env.PJORION_EXE_SHA256 }}") {
              throw "Unexpected PjOrion.exe SHA256: $hash"
          }

          Copy-Item -Path "tools\pjorion\PjOrion.ini" -Destination (Join-Path $exe.DirectoryName "PjOrion.ini") -Force
          "PJORION_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PjOrion verified: $($exe.FullName)"

      - name: Create build configuration
        shell: pwsh
        run: |
          $configuration = @{
              version = 5
              software = @{
                  python = "C:/Python27/python.exe"
              }
              game = @{
                  force = $false
                  folder = "World_of_Tanks_EU"
                  version = "2"
              }
              info = @{
                  id = "${{ env.MOD_ID }}"
                  name = "${{ env.MOD_NAME }}"
                  description = "${{ env.MOD_DESCRIPTION }}"
                  version = "${{ env.PROJECT_VERSION }}"
              }
          }

          $configuration |
              ConvertTo-Json -Depth 4 |
              Set-Content -Path build.json -Encoding utf8

      - name: Build protected WOTMOD package
        shell: pwsh
        run: |
          python build_protected.py
          $package = "build\${{ env.MOD_ID }}_${{ env.PROJECT_VERSION }}.wotmod"
          if (-not (Test-Path $package)) {
              throw "Package was not created: $package"
          }

      - name: Verify package contains protected outputs
        shell: pwsh
        run: |
          $package = "build\${{ env.MOD_ID }}_${{ env.PROJECT_VERSION }}.wotmod"
          $check = Join-Path $env:RUNNER_TEMP "wotmod-check"
          Expand-Archive -Path $package -DestinationPath $check -Force

          $plainPython = Get-ChildItem -Path $check -Filter *.py -Recurse
          if ($plainPython.Count -gt 0) {
              throw "Plain .py files leaked into WOTMOD"
          }

          $pycFiles = Get-ChildItem -Path $check -Filter *.pyc -Recurse
          if ($pycFiles.Count -eq 0) {
              throw "No PYC files found in WOTMOD"
          }
          Write-Host "Protected PYC files: $($pycFiles.Count)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mastery-under-inq-${{ env.PROJECT_VERSION }}
          path: build/mastery_under_inq_${{ env.PROJECT_VERSION }}.wotmod
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          name: Masters v${{ env.PROJECT_VERSION }}
          artifacts: build/mastery_under_inq_${{ env.PROJECT_VERSION }}.wotmod
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
