<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="MasteryTankStats.css" />
    <link rel="stylesheet" href="MasteryTankStatsFix.css" />
    <link rel="stylesheet" href="MasteryTypeIcons.css" />
    <link rel="stylesheet" href="MasteryStatsColumns.css" />
    <style>.page:disabled{pointer-events:none!important;opacity:.34!important;cursor:default!important;box-shadow:none!important}</style>
</head>
<body>
    <script>
        document.addEventListener('click', function(event) {
            var node = event.target;
            while (node && node !== document && !(node.classList && node.classList.contains('page'))) node = node.parentNode;
            if (node && node.disabled) {
                event.preventDefault(); event.stopPropagation();
                if (event.stopImmediatePropagation) event.stopImmediatePropagation();
                return false;
            }
        }, true);
    </script>
    <script type="module" src="MasteryTankStats.js"></script>
</body>
</html>
